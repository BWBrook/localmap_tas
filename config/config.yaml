        gap_px: 8
        labels:
          values: ["a)", "b)"]
          padding_px: 12
          colour: "#050505"
          font_size: 28
    analysis_layers:
      - id: "jc_tasveg"
        type: "vector_arcgis"
        url: "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/NaturalEnvironment/MapServer/84"
        crs: "EPSG:4326"
        output_path: "outputs/analysis/jc/vector/jc_tasveg.gpkg"
        offline: false
        fixture_path: "inst/extdata/jc_habitats.gpkg"
        fixture_layer: "habitats"
        attribution:
          source: "The LIST"
          license: "CC BY 4.0"
          credit: "TASVEG 4.0 Groups (vector)"
      - id: "jc_dem"
        type: "raster_wcs"
        url: "https://services.ga.gov.au/gis/services/DEM_SRTM_1Second_2024/MapServer/WCSServer"
        coverage: "1"
        version: "1.0.0"
        crs: "EPSG:4326"
        format: "GeoTIFF"
        resolution: "1s"
        output_path: "outputs/analysis/jc/raster/jc_dem.tif"
        categorical: false
        units: "m"
        offline: false
        fixture_path: "inst/extdata/jc_dem.tif"
        fallback:
          type: "raster_geodata"
          resolution: "3s"
        attribution:
          source: "Geoscience Australia"
          license: "CC BY 4.0"
          credit: "DEM SRTM 1 Second 2024"
      - id: "jc_multiband"
        type: "raster_wcs"
        url: "https://ows.dea.ga.gov.au/wcs"
        coverage: "ga_ls8cls9c_gm_cyear_3"
        version: "1.0.0"
        crs: "EPSG:4326"
        format: "GeoTIFF"
        resolution: 0.00027
        output_path: "outputs/analysis/jc/raster/jc_multiband.tif"
        categorical: false
        units: "reflectance"
        offline: false
        fixture_path: "inst/extdata/jc_multiband.tif"
        fallback:
          type: "raster_file"
          path: "inst/extdata/jc_multiband.tif"
        attribution:
          source: "Digital Earth Australia"
          license: "CC BY 4.0"
          credit: "DEA Landsat 8/9 Geomedian (ga_ls8cls9c_gm_cyear_3)"
      - id: "jc_slope"
        type: "derived_slope"
        source_id: "jc_dem"
        output_path: "outputs/analysis/jc/raster/jc_slope.tif"
        units: "degrees"
        attribution:
          source: "Derived from jc_dem"
          license: "CC BY 4.0"
          credit: "Slope"
      - id: "jc_ndvi"
        type: "derived_ndvi"
        source_id: "jc_multiband"
        bands:
          red: ["nbart_red", "red"]
          nir: ["nbart_nir", "nir"]
        output_path: "outputs/analysis/jc/raster/jc_ndvi.tif"
        units: "index"
        attribution:
          source: "Derived from jc_multiband"
          license: "CC BY 4.0"
          credit: "NDVI"
      - id: "jc_nbr"
        type: "derived_nbr"
        source_id: "jc_multiband"
        bands:
          nir: ["nbart_nir", "nir"]
          swir2: ["nbart_swir_2", "swir2", "swir_2"]
        output_path: "outputs/analysis/jc/raster/jc_nbr.tif"
        units: "index"
        attribution:
          source: "Derived from jc_multiband"
          license: "CC BY 4.0"
          credit: "NBR"
    attributes:
      enabled: true
      output_long: "outputs/tables/jc/site_attributes_long.parquet"
      output_wide: "outputs/tables/jc/site_attributes_wide.csv"

