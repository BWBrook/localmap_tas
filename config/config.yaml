default:
  schema_version: 2
  data_dir: "data"
  db_path: "data/interim/local.duckdb"
  sample_frac: 1.0
  data:
    aoi:
      centroid:
        lat: -41.97708
        lon: 146.3484
      size_km: 400
      rotation_deg: 0
      crs: "EPSG:28355"
    manifest: "metadata/data_manifest.csv"
    species_requests: "metadata/species_requests.csv"
    analysis_layers: []
    dem_variant: "ga_1s"
    dem_variant_path: null
    attributes:
      enabled: true
      output_long: "outputs/tables/default/site_attributes_long.parquet"
      output_wide: "outputs/tables/default/site_attributes_wide.csv"
    occurrence:
      min_year: 2000
      min_lat: null
      state_province: "Tasmania"
      boundary: null
      boundary_simplify: 1000
      fields:
        - decimalLatitude
        - decimalLongitude
        - eventDate
        - vernacularName
        - scientificName
        - dataResourceName
        - taxonConceptID
      map:
        basemap: "rnaturalearth"
        show_title: false
        show_legend: false
        point_colour: "#2171b5"
        point_size: 1.6
        additional_points:
          path: "data/raw/lyr_pt.csv"
          colour: "#d73027"
          size: null
        tile_provider: "Esri.WorldImagery"
        tile_zoom: 8
        tile_outline_colour: "#ffffff"
        tile_graticule: true
        topo_output_path: "outputs/maps/species_topo.png"
        bounding_box:
          top_left:
            lat: -40.2
            lon: 144.0
          length_km: 400
        output_path: "outputs/maps/species_occurrences.png"
    camera_sites:
      path: "data/raw/lyr_op.csv"
      central_site: "wc_s10_c5"
      bbox_half_km: 25
      basemap:
        provider: "list_tasveg"
        type: "wms"
        url: "https://services.thelist.tas.gov.au/arcgis/services/Public/NaturalEnvironment/MapServer/WMSServer"
        version: "1.3.0"
        layers:
          - "TASVEG_4.0_Groups55513"
        crs: "EPSG:3857"        # safe for WMS 1.3.0 (no axis flip)
        styles: "default"
        format: "image/png"
        max_scale: 100000
        transparent: true
        width: 2048
        height: 2048
        dpi: 96
        legend_path: "outputs/tiles/tasveg_camera_sites_legend.png"
        overlays:
          - name: roads
            url: "https://services.thelist.tas.gov.au/arcgis/services/Public/TopographyAndRelief/MapServer/WMSServer"
            layers:
              - "State_Growth_Roads26192"         # WMS Name from GetCapabilities
            styles: ""                             # optional; often blank for ArcGIS services
            opacity: 0.65                          # 0–1, defaults to 0.6 if omitted
            max_scale: 100000                      # optional; overrides the base max_scale
            output_path: "outputs/tiles/roads.png" # optional; auto-generated if omitted
          - name: towns
            url: "https://services.thelist.tas.gov.au/arcgis/services/Public/CadastreAndAdministrative/MapServer/WMSServer"
            layers:
              - "Localities"
            styles: ""
            opacity: 0.75
            max_scale: 100000                        
            output_path: "outputs/tiles/towns.png"
        output_path: "outputs/tiles/tasveg_camera_sites.png"
      map:
        output_path: "outputs/maps/camera_sites.png"
        scale_bar_location: "tl"
        north_arrow_location: "tr"
        point_size_min: 1.0
        point_size_max: 5.0
        zero_obs_colour: "#050505"
        positive_obs_colour: "#d73027"
        show_graticule: true
        graticule_colour: "#050505"
        graticule_alpha: 0.4
        graticule_label_size: 3
        legend:
          show: true
          position: right
          layout: overlay
          width_fraction: 0.2
          margin_fraction: 0.05
      stack:
        glob: outputs/maps/camera_sites_*.png
        input_dir: outputs/maps
        pattern: camera_sites_.*\\.png$
        order:
          - "camera_sites_mccall_m"
          - "camera_sites_mccall_p"
          - "camera_sites_rosebery_m"
          - "camera_sites_rosebery_p"
          - "camera_sites_mt_roland_m"
          - "camera_sites_mt_roland_p"
        columns: 2    # 2 across × 3 down for six panels
        rows: 3
        output_path: outputs/maps/camera_sites_panel.png
        gap_px: 6
        background: "#ffffff"
        labels:
          values: ["a)", "b)", "c)", "d)", "e)", "f)"]
          padding_px: 20
          colour: "#050505"
          font_size: 50
  ala:
    email: "barry.brook@utas.edu.au"
    atlas: "ALA"
    caching: true
    verbose: false
    download_reason_id: 4

local:
  inherits: default

ci:
  inherits: default
  sample_frac: 0.02

slurm:
  inherits: default
  workers: 64
  time: "06:00:00"
  mem_gb: 4

demo:
  inherits: default
  ala:
    use_fixture: true
    fixture_occurrences: "inst/extdata/occurrences_demo.csv"
  data:
    occurrence:
      map:
        output_path: "outputs/maps/demo/species_occurrences.png"
        topo_output_path: "outputs/maps/demo/species_topo.png"
        additional_points:
          path: null
        enable_topo_tiles: false
    camera_sites:
      path: "inst/extdata/camera_sites_demo.csv"
      central_site: "centre"
      bbox_half_km: 10
      basemap:
        url: ""
        layers: []
        overlays: []
        output_path: "outputs/tiles/demo_camera_sites_tile.png"
      map:
        output_path: "outputs/maps/demo/camera_sites.png"
        legend:
          show: false
      stack:
        paths:
          - "outputs/maps/demo/species_occurrences.png"
          - "outputs/maps/demo/camera_sites.png"
        glob: []
        input_dir: []
        columns: 1
        rows: 2
        output_path: "outputs/maps/demo/camera_sites_panel.png"
        gap_px: 8
        labels:
          values: ["a)", "b)"]
          padding_px: 12
          colour: "#ffffff"
          font_size: 28
    coverage:
      enabled: true
      buffer_m: 250
      summary_path: "outputs/tables/demo/coverage_summary.csv"
    attributes:
      output_long: "outputs/tables/demo/site_attributes_long.parquet"
      output_wide: "outputs/tables/demo/site_attributes_wide.csv"
    layers:
      - id: "orthophoto_arcgis"
        type: "arcgis_export"
        url: "https://services.thelist.tas.gov.au/arcgis/rest/services/Basemaps/Orthophoto/MapServer/export"
