        format: "png"
        width: 2000
        height: 2000
        dpi: 96
        output_path: "outputs/layers/jc/orthophoto_arcgis.png"
        offline: true
        attribution:
          source: "The LIST"
          license: "CC BY 4.0"
          credit: "Orthophoto"
      - id: "tasveg_wms"
        type: "wms"
        url: "https://services.thelist.tas.gov.au/arcgis/services/Public/NaturalEnvironment/MapServer/WMSServer"
        layers:
          - "TASVEG_4.0_Groups55513"
        styles: ""
        crs: "EPSG:3857"
        format: "image/png"
        width: 1600
        height: 1600
        dpi: 96
        output_path: "outputs/layers/demo/tasveg_wms.png"
        offline: true
        attribution:
          source: "The LIST"
          license: "CC BY 4.0"
          credit: "TASVEG"
      - id: "topography_arcgis"
        type: "arcgis_export"
        url: "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/TopographyAndRelief/MapServer/export"
        layers:
          - 65
        crs: "EPSG:3857"
        format: "png"
        width: 1600
        height: 1600
        dpi: 96
        output_path: "outputs/layers/demo/topography_arcgis.png"
        offline: true
        attribution:
          source: "The LIST"
          license: "CC BY 4.0"
          credit: "Topography"
      - id: "roads_wms"
        type: "wms"
        url: "https://services.thelist.tas.gov.au/arcgis/services/Public/TopographyAndRelief/MapServer/WMSServer"
        layers:
          - "State_Growth_Roads26192"
        styles: ""
        crs: "EPSG:3857"
        format: "image/png"
        width: 1600
        height: 1600
        dpi: 96
        output_path: "outputs/layers/demo/roads_wms.png"
        offline: true
        attribution:
          source: "The LIST"
          license: "CC BY 4.0"
          credit: "State Growth Roads"
      - id: "localities_wms"
        type: "wms"
        url: "https://services.thelist.tas.gov.au/arcgis/services/Public/CadastreAndAdministrative/MapServer/WMSServer"
