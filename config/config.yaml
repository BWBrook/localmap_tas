default:
  schema_version: 2
  data_dir: "data"
  db_path: "data/interim/local.duckdb"
  sample_frac: 1.0
  data:
    aoi:
      centroid:
        lat: -41.97708
        lon: 146.3484
      size_km: 400
      rotation_deg: 0
      crs: "EPSG:28355"
    manifest: "metadata/data_manifest.csv"
    species_requests: "metadata/species_requests.csv"
    occurrence:
      min_year: 2000
      min_lat: null
      state_province: "Tasmania"
      boundary: null
      boundary_simplify: 1000
      fields:
        - decimalLatitude
        - decimalLongitude
        - eventDate
        - vernacularName
        - scientificName
        - dataResourceName
        - taxonConceptID
      map:
        basemap: "rnaturalearth"
        show_title: false
        show_legend: false
        point_colour: "#2171b5"
        point_size: 1.6
        additional_points:
          path: "data/raw/lyr_pt.csv"
          colour: "#d73027"
          size: null
        tile_provider: "Esri.WorldImagery"
        tile_zoom: 8
        tile_outline_colour: "#ffffff"
        tile_graticule: true
        topo_output_path: "outputs/maps/species_topo.png"
        bounding_box:
          top_left:
            lat: -40.2
            lon: 144.0
          length_km: 400
        output_path: "outputs/maps/species_occurrences.png"
    camera_sites:
      path: "data/raw/lyr_op.csv"
      central_site: "wc_s10_c5"
      bbox_half_km: 25
      basemap:
        provider: "list_tasveg"
        type: "wms"
        url: "https://services.thelist.tas.gov.au/arcgis/services/Public/NaturalEnvironment/MapServer/WMSServer"
        version: "1.3.0"
        layers:
          - "TASVEG_4.0_Groups55513"
        crs: "EPSG:3857"        # safe for WMS 1.3.0 (no axis flip)
        styles: "default"
        format: "image/png"
        max_scale: 100000
        transparent: true
        width: 2048
        height: 2048
        dpi: 96
        legend_path: "outputs/tiles/tasveg_camera_sites_legend.png"
        overlays:
          - name: roads
            url: "https://services.thelist.tas.gov.au/arcgis/services/Public/TopographyAndRelief/MapServer/WMSServer"
            layers:
              - "State_Growth_Roads26192"         # WMS Name from GetCapabilities
            styles: ""                             # optional; often blank for ArcGIS services
            opacity: 0.65                          # 0–1, defaults to 0.6 if omitted
            max_scale: 100000                      # optional; overrides the base max_scale
            output_path: "outputs/tiles/roads.png" # optional; auto-generated if omitted
          - name: towns
            url: "https://services.thelist.tas.gov.au/arcgis/services/Public/CadastreAndAdministrative/MapServer/WMSServer"
            layers:
              - "Localities"
            styles: ""
            opacity: 0.75
            max_scale: 100000                        
            output_path: "outputs/tiles/towns.png"
        output_path: "outputs/tiles/tasveg_camera_sites.png"
      map:
        output_path: "outputs/maps/camera_sites.png"
        scale_bar_location: "tl"
        north_arrow_location: "tr"
        point_size_min: 1.0
        point_size_max: 5.0
        zero_obs_colour: "#050505"
        positive_obs_colour: "#d73027"
        show_graticule: true
        graticule_colour: "#050505"
        graticule_alpha: 0.4
        graticule_label_size: 3
        legend:
          show: true
          position: right
          layout: overlay
          width_fraction: 0.2
          margin_fraction: 0.05
      stack:
        glob: outputs/maps/camera_sites_*.png
        input_dir: outputs/maps
        pattern: camera_sites_.*\\.png$
        order:
          - "camera_sites_mccall_m"
          - "camera_sites_mccall_p"
          - "camera_sites_rosebery_m"
          - "camera_sites_rosebery_p"
          - "camera_sites_mt_roland_m"
          - "camera_sites_mt_roland_p"
        columns: 2    # 2 across × 3 down for six panels
        rows: 3
        output_path: outputs/maps/camera_sites_panel.png
        gap_px: 6
        background: "#ffffff"
        labels:
          values: ["a)", "b)", "c)", "d)", "e)", "f)"]
          padding_px: 20
          colour: "#050505"
          font_size: 50
  ala:
    email: "barry.brook@utas.edu.au"
    atlas: "ALA"
    caching: true
    verbose: false
    download_reason_id: 4

local:
  inherits: default

ci:
  inherits: default
  sample_frac: 0.02

slurm:
  inherits: default
  workers: 64
  time: "06:00:00"
  mem_gb: 4

demo:
  inherits: default
  ala:
    use_fixture: true
    fixture_occurrences: "inst/extdata/occurrences_demo.csv"
  data:
    occurrence:
      map:
        output_path: "outputs/maps/demo_species_occurrences.png"
        topo_output_path: "outputs/maps/demo_species_topo.png"
        additional_points:
          path: null
        enable_topo_tiles: false
    camera_sites:
      path: "inst/extdata/camera_sites_demo.csv"
      central_site: "centre"
      bbox_half_km: 10
      basemap:
        url: ""
        layers: []
        overlays: []
        output_path: "outputs/tiles/demo_camera_sites_tile.png"
      map:
        output_path: "outputs/maps/demo_camera_sites.png"
        legend:
          show: false
      stack:
        paths:
          - "outputs/maps/demo_species_occurrences.png"
          - "outputs/maps/demo_camera_sites.png"
        glob: []
        input_dir: []
        columns: 1
        rows: 2
        output_path: "outputs/maps/demo_camera_sites_panel.png"
        gap_px: 8
        labels:
          values: ["a)", "b)"]
          padding_px: 12
          colour: "#ffffff"
          font_size: 28
    coverage:
      enabled: true
      buffer_m: 250
      summary_path: "outputs/tables/demo_coverage_summary.csv"
    layers:
      - id: "tasveg_wms"
        type: "wms"
        url: "https://services.thelist.tas.gov.au/arcgis/services/Public/NaturalEnvironment/MapServer/WMSServer"
        layers:
          - "TASVEG_4.0_Groups55513"
        styles: ""
        crs: "EPSG:3857"
        format: "image/png"
        width: 1600
        height: 1600
        dpi: 96
        output_path: "outputs/layers/demo_tasveg_wms.png"
        offline: true
        attribution:
          source: "The LIST"
          license: "CC BY 4.0"
          credit: "TASVEG"
      - id: "topography_arcgis"
        type: "arcgis_export"
        url: "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/TopographyAndRelief/MapServer/export"
        crs: "EPSG:3857"
        format: "png"
        width: 1600
        height: 1600
        dpi: 96
        output_path: "outputs/layers/demo_topography_arcgis.png"
        offline: true
        attribution:
          source: "The LIST"
          license: "CC BY 4.0"
          credit: "Topography"
    overview_map:
      output_path: "outputs/maps/demo_overview_map.png"
      width: 7
      height: 7
      dpi: 300
      base_layer_id: "tasveg_wms"
      overlays:
        - id: "topography_arcgis"
          opacity: 0.35
      show_labels: false
      point_colour: "#2171b5"
      point_size: 2
      aoi_colour: "#d95f0e"
      coverage_colour: "#2ca25f"
      coverage_alpha: 0.15
      scale_bar_location: "bl"
      north_arrow_location: "tr"
    panel_figure:
      paths:
        - "outputs/maps/demo_overview_map.png"
        - "outputs/maps/demo_species_occurrences.png"
        - "outputs/maps/demo_camera_sites.png"
        - "outputs/maps/demo_species_topo.png"
      order:
        - "demo_overview_map"
        - "demo_species_occurrences"
        - "demo_camera_sites"
        - "demo_species_topo"
      columns: 2
      rows: 2
      output_path: "outputs/maps/demo_panel_figure.png"
      output_pdf: "outputs/maps/demo_panel_figure.pdf"
      gap_px: 8
      labels:
        values: ["a)", "b)", "c)", "d)"]
        padding_px: 16
        colour: "#050505"
        font_size: 28

jc:
  inherits: default
  ala:
    use_fixture: true
    fixture_occurrences: "inst/extdata/occurrences_jc.csv"
  data:
    species_requests: "metadata/species_requests_jc.csv"
    aoi:
      mode: "auto"
      buffer_multiplier: 1
      min_buffer_km: 0.1
      rotation_deg: 0
    coverage:
      enabled: true
      buffer_m: 50
      summary_path: "outputs/tables/jc_coverage_summary.csv"
    layers:
      - id: "tasveg_wms"
        type: "wms"
        url: "https://services.thelist.tas.gov.au/arcgis/services/Public/NaturalEnvironment/MapServer/WMSServer"
        layers:
          - "TASVEG_4.0_Groups55513"
        styles: ""
        crs: "EPSG:3857"
        format: "image/png"
        width: 1600
        height: 1600
        dpi: 96
        output_path: "outputs/layers/jc_tasveg_wms.png"
        offline: true
        attribution:
          source: "The LIST"
          license: "CC BY 4.0"
          credit: "TASVEG"
      - id: "topography_arcgis"
        type: "arcgis_export"
        url: "https://services.thelist.tas.gov.au/arcgis/rest/services/Public/TopographyAndRelief/MapServer/export"
        crs: "EPSG:3857"
        format: "png"
        width: 1600
        height: 1600
        dpi: 96
        output_path: "outputs/layers/jc_topography_arcgis.png"
        offline: true
        attribution:
          source: "The LIST"
          license: "CC BY 4.0"
          credit: "Topography"
    overview_map:
      output_path: "outputs/maps/jc_overview_map.png"
      width: 7
      height: 7
      dpi: 300
      base_layer_id: "tasveg_wms"
      overlays:
        - id: "topography_arcgis"
          opacity: 0.35
      show_labels: false
      point_colour: "#2171b5"
      point_size: 2
      aoi_colour: "#d95f0e"
      coverage_colour: "#2ca25f"
      coverage_alpha: 0.15
      scale_bar_location: "bl"
      north_arrow_location: "tr"
    panel_figure:
      paths:
        - "outputs/maps/jc_overview_map.png"
        - "outputs/maps/species_occurrences.png"
        - "outputs/maps/camera_sites.png"
        - "outputs/maps/species_topo.png"
      order:
        - "jc_overview_map"
        - "species_occurrences"
        - "camera_sites"
        - "species_topo"
      columns: 2
      rows: 2
      output_path: "outputs/maps/jc_panel_figure.png"
      output_pdf: "outputs/maps/jc_panel_figure.pdf"
      gap_px: 8
      labels:
        values: ["a)", "b)", "c)", "d)"]
        padding_px: 16
        colour: "#050505"
        font_size: 28
    camera_sites:
      source: "jc"
      jc:
        site_path: "data/jc_camera_study/jc_site.csv"
        obs_path: "data/jc_camera_study/jc_obs.csv"
        output_path: "data/interim/jc_camera_sites.csv"
      path: "data/interim/jc_camera_sites.csv"
      central_site: "jc_cen"
      bbox_half_km: 2
