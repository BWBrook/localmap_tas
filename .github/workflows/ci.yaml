name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    name: r-cmd-check + lint

    env:
      R_KEEP_PKG_SOURCE: "yes"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Lint
        run: Rscript -e 'if (!requireNamespace(\"lintr\", quietly = TRUE)) install.packages(\"lintr\"); l <- lintr::lint_package(); if (length(l) > 0) { print(l); quit(status = 1) }'

      - uses: r-lib/actions/check-r-package@v2
