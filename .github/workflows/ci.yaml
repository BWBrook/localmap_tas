name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    name: lint + test + offline pipelines + package check

    env:
      R_KEEP_PKG_SOURCE: "yes"
      RENV_CONFIG_PAK_ENABLED: "FALSE"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecret-1-0 libsecret-1-dev \
            libudunits2-dev \
            libproj-dev libgdal-dev libgeos-dev \
            libglpk-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install renv
        run: Rscript -e 'install.packages("renv")'

      - name: Bootstrap QA environment
        run: make bootstrap-qa

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Demo pipeline (offline)
        env:
          R_CONFIG_ACTIVE: demo
          TARGETS_PROFILE: ci
        run: Rscript -e 'targets::tar_make()'

      - name: Collect demo artifacts
        if: always()
        run: |
          mkdir -p ci_artifacts/demo
          cp outputs/demo/maps/*.png ci_artifacts/demo/ 2>/dev/null || true
          cp outputs/demo/tiles/*.png ci_artifacts/demo/ 2>/dev/null || true
          cp outputs/demo/provenance/* ci_artifacts/demo/ 2>/dev/null || true

      - name: JC pipeline (offline)
        env:
          R_CONFIG_ACTIVE: jc_ci
          TARGETS_PROFILE: ci
        run: Rscript -e 'targets::tar_invalidate("cfg"); targets::tar_make(names = c("species_map","camera_sites_tile","camera_sites_map","camera_sites_panel","topo_tile_map","overview_map","panel_figure_png","panel_figure_pdf"))'

      - name: Collect JC artifacts
        if: always()
        run: |
          mkdir -p ci_artifacts/jc
          cp outputs/jc/maps/*.png ci_artifacts/jc/ 2>/dev/null || true
          cp outputs/jc/tiles/*.png ci_artifacts/jc/ 2>/dev/null || true
          cp outputs/jc/provenance/* ci_artifacts/jc/ 2>/dev/null || true

      - name: R CMD check
        run: make check

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: ci_artifacts
