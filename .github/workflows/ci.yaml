name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    name: r-cmd-check + lint

    env:
      R_KEEP_PKG_SOURCE: "yes"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Prepare CI artifacts
        run: |
          mkdir -p ci_artifacts
          echo "ci artifacts placeholder" > ci_artifacts/placeholder.txt

      - name: Lint
        run: >-
          Rscript -e 'if (!requireNamespace("lintr", quietly = TRUE)) install.packages("lintr");
          l <- lintr::lint_package();
          if (length(l) > 0) { print(l); quit(status = 1) }'

      - name: Unit tests
        run: >-
          Rscript -e 'pkgload::load_all();
          results <- testthat::test_dir("tests/testthat", stop_on_failure = FALSE);
          summary <- as.data.frame(results);
          totals <- c(
            sprintf("tests: %s", nrow(summary)),
            sprintf("expectations_passed: %s", sum(summary$passed, na.rm = TRUE)),
            sprintf("expectations_failed: %s", sum(summary$failed, na.rm = TRUE)),
            sprintf("warnings: %s", sum(summary$warning, na.rm = TRUE)),
            sprintf("errors: %s", sum(summary$error, na.rm = TRUE)),
            sprintf("skipped: %s", sum(summary$skipped, na.rm = TRUE))
          );
          writeLines(totals, "ci_artifacts/test_summary.txt");
          if (sum(summary$failed, na.rm = TRUE) > 0 || sum(summary$error, na.rm = TRUE) > 0) quit(status = 1)'

      - name: Demo pipeline (offline)
        env:
          R_CONFIG_ACTIVE: demo
          TARGETS_PROFILE: ci
        run: Rscript -e 'targets::tar_make()'

      - name: Collect demo artifacts
        run: |
          mkdir -p ci_artifacts/demo
          cp outputs/maps/demo_*.png ci_artifacts/demo/ || true
          cp outputs/tiles/demo_*.png ci_artifacts/demo/ || true

      - name: JC pipeline (offline)
        env:
          R_CONFIG_ACTIVE: jc_ci
          TARGETS_PROFILE: ci
        run: Rscript -e 'targets::tar_invalidate("cfg"); targets::tar_make(names = c("species_map","camera_sites_tile","camera_sites_map","camera_sites_panel","topo_tile_map","overview_map","panel_figure_png","panel_figure_pdf"))'

      - name: Collect JC artifacts
        run: |
          mkdir -p ci_artifacts/jc
          cp outputs/maps/jc_*.png ci_artifacts/jc/ || true
          cp outputs/tiles/jc_*.png ci_artifacts/jc/ || true

      - uses: r-lib/actions/check-r-package@v2

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: ci_artifacts
