template:
  bootstrap: 5

destination: outputs/pkgdown

url: ~

home:
  title: localmap
  description: Reproducible, settings-first local mapping for Tasmanian field sites

navbar:
  structure:
    left: [docs, get-started, reference, articles, report]
    right: [search]
  components:
    docs:
      text: Docs
      href: ../quarto/index.html
    get-started:
      text: Get started
      href: ../quarto/settings.html
    report:
      text: JC report
      href: ../reports/paper.html

reference:
  - title: Primary
    contents: [cfg_read, run_settings]
  - title: "Advanced: configuration and spatial"
    contents: [build_aoi_from_config, build_coverage_zone, fetch_analysis_layers, build_site_attributes_long]
  - title: "Advanced: ALA"
    contents: [read_species_requests, ala_resolve_species, ala_fetch_occurrences]
  - title: "Advanced: rendering and outputs"
    contents: [render_overview_map, map_species_occurrences, assemble_panel_figure]
  - title: Experimental
    contents: [ala_configure, fetch_layer_registry, generate_topo_tile_map]
  - title: internal
    contents:
      - ala_default_occurrence_fields
      - analysis_layer_types
      - build_layer_provenance
      - fetch_arcgis_imagery
      - fetch_camera_wms_tile
