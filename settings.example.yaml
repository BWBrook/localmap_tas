settings:
  project: "judbury_cameras"
  base_profile: "jc"
  input_dir: "data/raw/jc_camera_study"
  site_file: "site.csv"
  obs_file: "obs.csv"
  op_file: "op.csv"
  central_site: "jc_cen"
  aoi:
    mode: "auto"
    buffer_km: 0.1
  camera_sites:
    bbox_half_km: 2
  layers:
    include:
      - orthophoto
      - tasveg
  analysis_layers:
    include:
      - dem
      - canopy_height
      - tasveg
  outputs:
    dir: "outputs/judbury_cameras"
