# Real-data-only template; this is not the clean-checkout demonstration input.
# Before running, input_dir must contain site.csv with site, lat, and lon.
# obs.csv and op.csv are optional. Set either filename to "" when absent.
settings:
  project: "judbury_cameras"
  base_profile: "jc"
  input_dir: "data/raw/jc_camera_study"
  site_file: "site.csv"
  obs_file: "obs.csv"
  op_file: "op.csv"
  central_site: "jc_cen"
  # Select attributes, atlas, figure, any subset, or all (the default).
  products: all
  aoi:
    mode: "auto"
    buffer_km: 0.1
  camera_sites:
    bbox_half_km: 2
  layers:
    include:
      - orthophoto
      - tasveg
  analysis_layers:
    include:
      - dem
      - canopy_height
      - tasveg
  outputs:
    dir: "outputs/judbury_cameras"
